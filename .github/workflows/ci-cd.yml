name: Run Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.4
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mega_mailer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: settings.settings.prod
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mega_mailer
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.12

    - name: Upgrade Pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Check Syntax
      run: |
        pip install pycodestyle
        pycodestyle --exclude=./src/utils/validators.py --statistics --max-line-length=500 .

    - name: Check syntax with flake8
      run: |
        pip install flake8
        flake8 --max-line-length 100 --exclude=src/settings/settings/prod.py

    - name: Wait for Postgres
      run: |
        while ! pg_isready -h localhost -p 5432; do
          echo "Waiting for Postgres to be ready..."
          sleep 1
        done

    - name: Add .env
      run: |
        cat <<EOF > ./src/settings/settings/.env
        DEBUG=False
        SQL_DEBUG=False
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS='*'
        STATIC_ROOT=var/www/staticfiles
        SQL_ENGINE=django.db.backends.postgresql
        SQL_USER=postgres
        SQL_PASSWORD=postgres
        SQL_DATABASE=mega_mailer
        SQL_PORT=5432
        RUN_IN_DOCKER=False
        BROKER_URL=redis://localhost:6385/0
        REDIS_HOST=redis
        REDIS_HOST_LOCAL=localhost
        REDIS_PORT=6379
        REDIS_PORT_LOCAL=6385
        CELERY_BROKER_URL=redis://redis:6379/0
        CELERY_RESULT_BACKEND=redis://redis:6379/0
        CELERY_ACCEPT_CONTENT=application/json
        EOF

    - name: Apply migrations
      run: |
        cd src/
        python manage.py migrate

    - name: Run tests
      run: |
        cd src/
        python manage.py test apps/
