version: "3.9"

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: settings.settings.prod
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./:/mm
    - ./logs:/mm/logs/
    - ./scripts:/mm/scripts/
    - ./src/static:/mm/src/static/
    - ./src/media:/mm/src/media/

x-backend: &backend
  <<: *backend-base
  environment:
    <<: *backend-environment

services:

  # Redis
  redis:
    image: redis:alpine
    container_name: mm_redis
    ports:
      - 6380:6379

  # Database Postgres
  db:
    image: postgres:15.4
    restart: always
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      # ... дополнительные настройки PostgreSQL ...
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mega_mailer
    ports:
      - ${POSTGRES_PORT:-5433}:5432
    container_name: mm_postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mega_mailer" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

  # Django ASGI App with Daphne
  asgi-server:
    <<: *backend
    ports:
      - 8000:8000
    command: sh -c "./scripts/wait-for-it.sh db:5432 -- daphne -b 0.0.0.0 -p 8000 settings.asgi:application"
    depends_on:
      - db
      - redis

  # Django WSGI App with Gunicorn
  wsgi-server:
    <<: *backend
    ports:
      - 8001:8001  # Example port for Gunicorn (can use any free port)
    command: sh -c "./scripts/wait-for-it.sh db:5432 -- gunicorn --bind 0.0.0.0:8001 --workers 4 settings.wsgi:application"
    depends_on:
      - db
      - redis

  # Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mm_nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - wsgi-server
    networks:
      - redis-django

networks:
  redis-django:
    driver: bridge
